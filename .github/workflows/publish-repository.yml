name: Publish Tizen repository

# Builds repository.json.signed from repository.input.json and publishes it to
# GitHub Pages (docs/repositories.md in Apps2Samsung/tizen-community-packages).
# Runs on every release, and daily: clients reject a manifest older than 7 days, so it
# must be re-signed even when nothing changed.

on:
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Apps2Samsung/tizen-community-packages
          ref: main
          path: _tcp
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install jsonschema

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build and sign
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I _tcp/scripts/repo-generate.py \
            --input repository.input.json \
            --out _site \
            --site-url "${{ steps.pages.outputs.base_url }}" \
            --previous "${{ steps.pages.outputs.base_url }}/repository.json.signed"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish-repository.yml/enable"
